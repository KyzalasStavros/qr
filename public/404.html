<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QR Generator</title>
    <!--
      GitHub Pages SPA routing fallback.
      When GitHub Pages 404s on a client-side route (e.g. /go/my-slug),
      this page fires and redirects to index.html, preserving the path
      in sessionStorage so the React app can restore it.
      Based on https://github.com/rafgraph/spa-github-pages (MIT)
    -->
    <script>
      var pathSegmentsToKeep = 1; // set to 1 for project site (/repo-name), 0 for user/org site
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
